<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquiry received | RevRoom.Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E2A1F">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#0E2A1F;--gold:#D4A017;--white:#fff;--muted-on-dark:#B9C8C0;--serif:'Lora',Georgia,serif;--sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--green);color:var(--white);font-family:var(--sans);line-height:1.6}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
header{padding:20px 24px}
header img{width:clamp(150px,22vw,210px);height:auto;display:block}
main{flex:1;display:flex;align-items:center;padding:24px}
.box{max-width:560px;margin:0 auto}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3rem);line-height:1.1}
p{margin-top:16px;color:var(--muted-on-dark);font-size:1.05rem}
.btn{display:inline-block;margin-top:32px;background:var(--gold);color:var(--green);padding:14px 28px;border-radius:6px;text-decoration:none;font-weight:500}
.btn:hover{background:#E3B53A}
</style>
</head>
<body>
<header><a href="index.html" aria-label="RevRoom.Studio home"><img src="logo-wordmark.png" alt="RevRoom.Studio" width="700" height="79"></a></header>
<main>
  <div class="box">
    <h1>Thank you. We have your enquiry.</h1>
    <p>We will review your details and files, then reply with scope and a quote. Please keep your phone or WhatsApp handy.</p>
    <a class="btn" href="index.html">Back to home</a>
  </div>
</main>
</body>
</html>
